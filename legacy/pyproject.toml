[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalhouse"
version = "1.7.0"
description = "Deprecated: moved to signalhouse-sms. Installs signalhouse-sms and re-exports it."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SignalHouse LLC", email = "support@signalhouse.io"},
]
dependencies = [
    "signalhouse-sms==1.7.0",
]

[project.urls]
Homepage = "https://github.com/signalhouse-sms/sdk-py"
Documentation = "https://app2.signalhouse.io/docs"
Repository = "https://github.com/signalhouse-sms/sdk-py"

[tool.setuptools]
packages = ["signalhouse"]
