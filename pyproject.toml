[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalhouse-sms"
version = "1.5.1"
description = "Python SDK for the SignalHouse API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SignalHouse LLC", email = "support@signalhouse.io"},
]
keywords = ["signalhouse", "sms", "mms", "10dlc", "messaging", "telecom", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/signalhouse-sms/sdk-py"
Documentation = "https://v2app.signalhouse.io/docs"
Repository = "https://github.com/signalhouse-sms/sdk-py"

# A wheel cannot run a post-install hook, so bundling the skills is only half the job:
# the developer runs this once to place them where their coding agent looks.
[project.scripts]
signalhouse-skills = "signalhouse_sms._skills:main"

[tool.setuptools.packages.find]
include = ["signalhouse_sms*"]

# The vendored skills are data, not modules, so they need an explicit include or the wheel ships
# without them and `signalhouse-skills` has nothing to install.
[tool.setuptools.package-data]
signalhouse_sms = ["skills/**/*"]
